<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Servicios Técnicos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h1 class="h3 mb-0">Listado de Servicios Técnicos</h1>
        </div>

        <div class="card-body">

            <div class="mb-3">
                <a th:href="@{/servicios/nuevo}" class="btn btn-primary">
                    Agregar servicio
                </a>
            </div>

            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Problema</th>
                        <th>Diagnóstico</th>
                        <th>Resuelto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.id}">1</td>
                        <td th:text="${servicio.descripcion}">Descripción</td>
                        <td th:text="${servicio.problema}">Problema</td>
                        <td th:text="${servicio.diagnostico}">Diagnóstico</td>

                        <td class="text-center">
                            <img th:if="${servicio.resuelto}"
                                 th:src="@{/imagenes/resuelto.png}"
                                 alt="Resuelto"
                                 width="40">

                            <img th:unless="${servicio.resuelto}"
                                 th:src="@{/imagenes/no-resuelto.png}"
                                 alt="No resuelto"
                                 width="40">
                        </td>

                        <td>
                            <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}" class="btn btn-info btn-sm">
                                Modificar
                            </a>

                            <a th:href="@{/servicios/{id}(id=${servicio.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirmarEliminacion()">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script th:src="@{/funciones.js}"></script>
</body>
</html>
