<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Servicio Técnico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h1 class="h3 mb-0">Agregar Servicio Técnico</h1>
        </div>

        <div class="card-body">

            <form th:action="@{/servicios}"
                  th:object="${servicio}"
                  method="post"
                  onsubmit="return validarFormulario()">

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text"
                           id="descripcion"
                           th:field="*{descripcion}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Problema</label>
                    <input type="text"
                           id="problema"
                           th:field="*{problema}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Diagnóstico</label>
                    <input type="text"
                           id="diagnostico"
                           th:field="*{diagnostico}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Resuelto</label>
                    <select th:field="*{resuelto}" class="form-select">
                        <option value="false">No</option>
                        <option value="true">Sí</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Oficina</label>
                    <select th:field="*{oficina}" class="form-select" required>
                        <option value="">Seleccione una oficina</option>
                        <option th:each="oficina : ${listaOficinas}"
                                th:value="${oficina.id}"
                                th:text="${oficina.nombre}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

                <a th:href="@{/servicios}" class="btn btn-secondary">
                    Volver
                </a>

            </form>

        </div>
    </div>

</div>

<script src="/funciones.js"></script>

</body>
</html>
