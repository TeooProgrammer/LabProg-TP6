<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Servicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-warning">
            <h2>Modificar Servicio Técnico</h2>
        </div>

        <div class="card-body">

            <form th:action="@{/servicios/{id}(id=${servicio.id})}"
                  th:object="${servicio}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" th:field="*{descripcion}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Problema</label>
                    <input type="text" th:field="*{problema}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Diagnóstico</label>
                    <input type="text" th:field="*{diagnostico}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Resuelto</label>
                    <select th:field="*{resuelto}" class="form-select">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    Actualizar
                </button>

                <a th:href="@{/servicios}" class="btn btn-secondary">
                    Volver
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
